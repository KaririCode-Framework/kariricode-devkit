; ============================================================================
; KaririCode DevKit - Error Reporting Configuration
; ============================================================================
; Strict error reporting configuration for development environment
; All errors, warnings, and notices are displayed to catch issues early
;
; Location: devkit/.config/php/error-reporting.ini
; ============================================================================

[PHP]
; ============================================================================
; ERROR REPORTING
; ============================================================================
; Report all errors, warnings, and notices
error_reporting = E_ALL

; Display errors on screen (development only)
display_errors = On
display_startup_errors = On

; Log errors to file
log_errors = On
error_log = /var/log/php_errors.log

; Detailed error messages
html_errors = On
docref_root = "https://www.php.net/manual/en/"
docref_ext = .html

; Track all errors
track_errors = Off
xmlrpc_errors = Off

; ============================================================================
; ASSERTIONS
; ============================================================================
; Enable assertions for development
zend.assertions = 1
assert.active = 1
assert.exception = 1
assert.warning = 0
assert.bail = 0

; ============================================================================
; DEVELOPMENT SETTINGS
; ============================================================================
; Hide PHP version in headers (security)
expose_php = Off

; Variables order
variables_order = "EGPCS"
request_order = "GP"

; Auto-detect line endings
auto_detect_line_endings = Off

; ============================================================================
; RESOURCE LIMITS
; ============================================================================
; Memory limit (generous for development)
memory_limit = 512M

; Maximum execution time
max_execution_time = 30
max_input_time = 60

; Input size limits
post_max_size = 25M
upload_max_filesize = 20M
max_file_uploads = 20

; ============================================================================
; OUTPUT BUFFERING
; ============================================================================
; Output buffering (off for immediate error display)
output_buffering = Off
implicit_flush = On

; ============================================================================
; DATE/TIME
; ============================================================================
; Default timezone
date.timezone = UTC

; ============================================================================
; SESSION
; ============================================================================
; Session configuration
session.save_handler = files
session.save_path = "/tmp"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 0
session.cookie_samesite = "Lax"
session.gc_probability = 1
session.gc_divisor = 100
session.gc_maxlifetime = 1440
session.sid_length = 48
session.sid_bits_per_character = 6

; ============================================================================
; OPCACHE (disabled for development)
; ============================================================================
; Disable opcache for development to see code changes immediately
opcache.enable = 0
opcache.enable_cli = 0

; If enabled, use these settings for development:
; opcache.validate_timestamps = 1
; opcache.revalidate_freq = 0
; opcache.max_accelerated_files = 10000
; opcache.memory_consumption = 128
; opcache.interned_strings_buffer = 16
; opcache.fast_shutdown = 1

; ============================================================================
; REALPATH CACHE
; ============================================================================
; Realpath cache (keep small for development)
realpath_cache_size = 4096K
realpath_cache_ttl = 120

; ============================================================================
; FILE UPLOADS
; ============================================================================
; File uploads enabled
file_uploads = On
upload_tmp_dir = /tmp

; ============================================================================
; SECURITY
; ============================================================================
; Disable dangerous functions (customize as needed)
disable_functions = 
disable_classes = 

; ============================================================================
; MAIL
; ============================================================================
; Mail configuration (usually handled by application)
SMTP = localhost
smtp_port = 25
sendmail_path = /usr/sbin/sendmail -t -i

; ============================================================================
; MISC
; ============================================================================
; Allow URL fopen (needed for many libraries)
allow_url_fopen = On
allow_url_include = Off

; Auto-prepend/append files
auto_prepend_file = 
auto_append_file = 

; Default charset
default_charset = "UTF-8"

; Maximum input variables (prevent resource exhaustion)
max_input_vars = 1000
max_input_nesting_level = 64

; ============================================================================
; EXTENSIONS
; ============================================================================
; Common extensions are enabled by default in kariricode/php-api-stack
; Additional extensions can be enabled as needed:
; extension=redis.so
; extension=memcached.so
; extension=apcu.so
; extension=imagick.so